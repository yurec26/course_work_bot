<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Reminder Admin</title>
    <style>

        :root {
            --bg: #14161b;
            --surface: #1d2027;
            --surface-hover: #252933;
            --border: #30343e;

            --text: #e4e6eb;
            --text-muted: #9298a5;

            --accent: #8896c7;
            --accent-hover: #a0add9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont,
            "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 30px;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.6px;
            margin: 0 0 8px;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0 0 32px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        th {
             background: #22252d;
             color: var(--text-muted);
             font-size: 12px;
             font-weight: 600;
             letter-spacing: 0.3px;
         }

        td {
            color: var(--text);
        }

        tbody tr {
            transition: background 0.15s ease;
        }

        tbody tr:hover {
            background: var(--surface-hover);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        td:first-child {
            color: var(--text-muted);
        }

        td:nth-child(4) {
            font-family: "SFMono-Regular", Consolas, monospace;
            color: var(--text-muted);
            font-size: 13px;
        }

        button {
            background: var(--accent);
            color: #14161b;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        button:focus-visible {
            outline: 2px solid var(--accent-hover);
            outline-offset: 3px;
        }

        /* Кнопки отправки внутри таблицы */
        td button {
            background: #303644;
            color: #c5cde4;
            border: 1px solid #414959;
            padding: 8px 14px;
        }

        td button:hover {
            background: #3a4355;
        }

        #status {
            color: var(--text-muted);
            font-size: 13px;
            margin: 24px 0 18px;
        }

        @media (max-width: 700px) {
            body {
                margin: 24px auto;
                padding: 0 12px;
            }

            th, td {
                padding: 10px;
                font-size: 12px;
            }
        }

    </style>
</head>
<body>

<h1>Админка Гоши</h1>
<p>Управление Telegram-напоминаниями</p>

<button onclick="loadReminders()">Обновить список</button>
<div id="status"></div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Пользователь</th>
        <th>Напоминание</th>
        <th>Время (МСК)</th>
        <th>Действие</th>
    </tr>
    </thead>
    <tbody id="reminders"></tbody>
</table>

<script>
    function addCell(row, value) {
        const cell = row.insertCell();
        cell.textContent = value;
        return cell;
    }

    async function loadReminders() {
        const tbody = document.getElementById("reminders");
        const status = document.getElementById("status");

        status.textContent = "Загрузка...";

        try {
            const response = await fetch("/api/reminders");

            if (!response.ok) {
                throw new Error("HTTP " + response.status);
            }

            const reminders = await response.json();
            tbody.replaceChildren();

            reminders.forEach(reminder => {
                const row = tbody.insertRow();

                addCell(row, reminder.id);
                addCell(row, reminder.username
                    ? "@" + reminder.username
                    : "Без username");
                addCell(row, reminder.message);
                addCell(row, reminder.remindAt.replace("T", " "));

                const button = document.createElement("button");
                button.textContent = "Отправить";

                button.onclick = async () => {
                    button.disabled = true;

                    try {
                        const result = await fetch(
                            `/api/reminders/${reminder.id}/send`,
                            {method: "POST"}
                        );

                        if (!result.ok) {
                            throw new Error("HTTP " + result.status);
                        }

                        await loadReminders();
                    } catch (error) {
                        alert("Ошибка отправки: " + error.message);
                        button.disabled = false;
                    }
                };

                row.insertCell().appendChild(button);
            });

            status.textContent =
                `Активных напоминаний: ${reminders.length}`;

        } catch (error) {
            status.textContent =
                "Ошибка загрузки: " + error.message;
        }
    }

    loadReminders();
</script>

</body>
</html>
